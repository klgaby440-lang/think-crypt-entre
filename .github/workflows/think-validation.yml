name: Think backend validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q main.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attributes = dict(attrs)
                      self.current = [] if "src" not in attributes else None

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      source = "".join(self.current).strip()
                      if source:
                          self.scripts.append(source)
                      self.current = None

          parser = InlineScripts()
          parser.feed(Path("app/index.html").read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No inline scripts were found.")

          with tempfile.TemporaryDirectory() as directory:
              for index, source in enumerate(parser.scripts, start=1):
                  path = Path(directory) / f"inline-{index}.js"
                  path.write_text(source, encoding="utf-8")
                  subprocess.run(["node", "--check", str(path)], check=True)

          print(f"JavaScript syntax OK: {len(parser.scripts)} inline scripts.")
          PY

      - name: Verify official CinetPay SDK and DRC methods
        run: |
          python - <<'PY'
          import cinetpay
          from cinetpay import CinetPayClient, ClientConfig, CountryCredentials
          from cinetpay import COUNTRY_CODES, PAYMENT_METHODS_BY_COUNTRY

          assert cinetpay.__version__ == "0.1.0"
          assert "CD" in COUNTRY_CODES
          assert set(PAYMENT_METHODS_BY_COUNTRY["CD"]) == {
              "OM_CD", "AIRTEL_CD", "MPESA_CD", "AFRICELL_CD"
          }
          client = CinetPayClient(ClientConfig(credentials={
              "CD": CountryCredentials(api_key="sk_test_ci_only", api_password="ci-test-password")
          }))
          assert client.countries() == ["CD"]
          client.close()
          print("Official CinetPay v1 SDK loaded; DRC (CD) and all four payment methods are available.")
          PY

      - name: Validate SQLAlchemy model mappings
        run: |
          python - <<'PY'
          import main
          from sqlalchemy.orm import configure_mappers

          configure_mappers()

          expected = {
              "think_users",
              "user_profiles",
              "wallets",
              "ledger_entries",
              "payment_transactions",
              "withdrawals",
              "transfers",
              "internal_transfers",
              "subscriptions",
              "notifications",
          }
          actual = set(main.Base.metadata.tables)
          missing = expected - actual
          if missing:
              raise SystemExit(f"Missing tables: {sorted(missing)}")

          print("SQLAlchemy mappings OK.")
          print("Tables:", ", ".join(sorted(actual)))
          PY
      - name: Smoke-test authenticated Sandbox API flows
        run: |
          python - <<'PY'
          import os
          from decimal import Decimal
          from fastapi.testclient import TestClient
          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker
          from sqlalchemy.pool import StaticPool

          os.environ["JWT_SECRET"] = "ci-test-secret-" + ("x" * 64)
          os.environ["APP_ENV"] = "sandbox"
          os.environ["CINETPAY_ENABLED"] = "true"
          os.environ["CINETPAY_MODE"] = "sandbox"
          os.environ["CINETPAY_API_KEY_CD"] = "sk_test_ci_only"
          os.environ["CINETPAY_API_PASSWORD_CD"] = "ci-test-password"
          os.environ["CINETPAY_CURRENCY"] = "CDF"

          import main

          engine = create_engine(
              "sqlite://",
              connect_args={"check_same_thread": False},
              poolclass=StaticPool,
          )
          main.Base.metadata.create_all(bind=engine)
          main.database_engine = engine
          main.SessionLocal = sessionmaker(
              bind=engine,
              autoflush=False,
              autocommit=False,
              expire_on_commit=False,
          )

          client = TestClient(main.app)

          created = client.post("/api/auth/register", json={
              "full_name": "Sandbox Test",
              "phone": "+243000000001",
              "email": "sandbox-test@example.test",
              "password": "SandboxPass123!",
              "country": "RDC",
              "currency": "CDF",
          })
          assert created.status_code == 200, created.text
          token = created.json()["access_token"]
          headers = {"Authorization": f"Bearer {token}"}

          me = client.get("/api/me", headers=headers)
          assert me.status_code == 200, me.text
          assert me.json()["email"] == "sandbox-test@example.test"

          credited = client.post("/api/wallet/sandbox-credit", headers=headers, json={
              "amount": "12000.00",
              "currency": "CDF",
              "reason": "CI test only",
          })
          assert credited.status_code == 200, credited.text
          assert credited.json()["no_real_money"] is True

          transfer = client.post("/api/transfers", headers=headers, json={
              "mode": "same",
              "agency": "Orange Money",
              "agency_slug": "orange",
              "recipient": "+243000000002",
              "beneficiary": "Test Recipient",
              "amount": "1500.00",
              "currency": "CDF",
              "reason": "CI sandbox transfer",
          })
          assert transfer.status_code == 200, transfer.text
          assert transfer.json()["transfer"]["status"] == "sandbox_pending"
          assert transfer.json()["no_real_money_sent"] is True

          withdrawal = client.post("/api/withdrawals", headers=headers, json={
              "amount": "2000.00",
              "currency": "CDF",
              "operator": "orange",
              "phone": "+243000000003",
          })
          assert withdrawal.status_code == 200, withdrawal.text
          assert withdrawal.json()["withdrawal"]["status"] == "sandbox_pending"
          assert withdrawal.json()["no_real_payout"] is True

          # Create a second independent account to test a real internal ledger move.
          bob_created = client.post("/api/auth/register", json={
              "full_name": "Sandbox Recipient",
              "phone": "+243000000004",
              "email": "sandbox-recipient@example.test",
              "password": "SandboxPass456!",
              "country": "RDC",
              "currency": "CDF",
          })
          assert bob_created.status_code == 200, bob_created.text
          bob_headers = {"Authorization": f"Bearer {bob_created.json()['access_token']}"}
          bob_think_id = bob_created.json()["user"]["think_id"]
          assert bob_think_id != created.json()["user"]["think_id"]

          resolved = client.get(f"/api/internal-transfers/recipient/{bob_think_id}", headers=headers)
          assert resolved.status_code == 200, resolved.text
          assert resolved.json()["recipient"]["think_id"] == bob_think_id
          assert resolved.json()["recipient"]["full_name"] == "Sandbox Recipient"

          internal_payload = {
              "recipient_think_id": bob_think_id,
              "amount": "2500.00",
              "currency": "CDF",
              "reason": "Alice to Bob internal sandbox test",
          }
          internal_headers = {**headers, "Idempotency-Key": "alice-bob-internal-test-001"}
          internal = client.post("/api/internal-transfers", headers=internal_headers, json=internal_payload)
          assert internal.status_code == 200, internal.text
          internal_json = internal.json()
          assert internal_json["transfer"]["status"] == "sandbox_completed"
          assert internal_json["transfer"]["direction"] == "sent"
          assert internal_json["transfer"]["recipient_think_id"] == bob_think_id
          assert internal_json["no_real_money_moved"] is True

          # Retrying the same request must return the same transfer, not debit twice.
          replay = client.post("/api/internal-transfers", headers=internal_headers, json=internal_payload)
          assert replay.status_code == 200, replay.text
          assert replay.json()["idempotent_replay"] is True
          assert replay.json()["transfer"]["public_id"] == internal_json["transfer"]["public_id"]
          mismatched_replay = client.post("/api/internal-transfers", headers=internal_headers, json={
              **internal_payload,
              "amount": "2400.00",
          })
          assert mismatched_replay.status_code == 409, mismatched_replay.text

          # Reject self-transfers and insufficient funds without changing either wallet.
          self_transfer = client.post("/api/internal-transfers", headers=headers, json={
              "recipient_think_id": created.json()["user"]["think_id"],
              "amount": "1.00",
              "currency": "CDF",
          })
          assert self_transfer.status_code == 400, self_transfer.text
          insufficient = client.post("/api/internal-transfers", headers=headers, json={
              "recipient_think_id": bob_think_id,
              "amount": "1000000.00",
              "currency": "CDF",
          })
          assert insufficient.status_code == 409, insufficient.text

          wallet = client.get("/api/wallet", headers=headers)
          assert wallet.status_code == 200, wallet.text
          assert Decimal(str(wallet.json()["balances"]["CDF"])) == Decimal("7000.0")
          assert Decimal(str(wallet.json()["reserved_balances"]["CDF"])) == Decimal("3500.0")

          bob_wallet = client.get("/api/wallet", headers=bob_headers)
          assert bob_wallet.status_code == 200, bob_wallet.text
          assert Decimal(str(bob_wallet.json()["balances"]["CDF"])) == Decimal("2500.0")
          assert Decimal(str(bob_wallet.json()["reserved_balances"]["CDF"])) == Decimal("0.0")

          alice_internal = client.get("/api/internal-transfers", headers=headers)
          bob_internal = client.get("/api/internal-transfers", headers=bob_headers)
          assert alice_internal.status_code == 200 and len(alice_internal.json()["items"]) == 1
          assert bob_internal.status_code == 200 and len(bob_internal.json()["items"]) == 1
          assert bob_internal.json()["items"][0]["direction"] == "received"
          assert bob_internal.json()["items"][0]["sender_think_id"] == created.json()["user"]["think_id"]

          bob_notifications = client.get("/api/notifications", headers=bob_headers)
          assert bob_notifications.status_code == 200
          assert any(item["title"] == "Transfert Think reçu" for item in bob_notifications.json()["items"])

          # Mock the official CinetPay v1 SDK: test the complete PayIn lifecycle
          # without making external requests or moving real money.
          from types import SimpleNamespace
          from unittest.mock import Mock, patch

          cinetpay_status = client.get("/api/cinetpay/status", headers=headers)
          assert cinetpay_status.status_code == 200, cinetpay_status.text
          assert cinetpay_status.json()["payin_enabled"] is True
          assert cinetpay_status.json()["payout_enabled"] is False
          assert cinetpay_status.json()["mode"] == "sandbox"

          fake_payment_response = SimpleNamespace(
              payment_url="https://checkout.cinetpay.net/pay/test-payment",
              notify_token="ci-notify-token",
              transaction_id="ci-cinetpay-transaction-001",
              payment_token="ci-payment-token",
              status="OK",
          )
          fake_provider_status = SimpleNamespace(
              status="SUCCESS",
              merchant_transaction_id=None,  # Filled after payment initialization.
              transaction_id="ci-cinetpay-transaction-001",
          )
          fake_payment_api = SimpleNamespace(
              initialize=Mock(return_value=fake_payment_response),
              get_status=Mock(),
          )
          fake_cinetpay = SimpleNamespace(payment=fake_payment_api)
          payin_config = {
              "mode": "sandbox",
              "currency": "CDF",
              "payin_enabled": True,
              "payout_enabled": False,
              "merchant_verified": False,
          }
          payin_payload = {
              "purpose": "wallet_deposit",
              "amount": "1000",
              "currency": "CDF",
              "description": "Test dépôt CinetPay",
              "payment_method": "OM_CD",
          }
          payin_headers = {**headers, "Idempotency-Key": "alice-cinetpay-payin-001"}
          with patch.object(main, "_require_cinetpay", return_value=(fake_cinetpay, payin_config)):
              payin = client.post("/api/payments/create", headers=payin_headers, json=payin_payload)
              assert payin.status_code == 200, payin.text
              payin_json = payin.json()
              assert payin_json["provider"] == "cinetpay_v1"
              assert payin_json["status"] == "pending"
              assert payin_json["test_mode"] is True
              assert payin_json["payment_url"] == fake_payment_response.payment_url
              assert "notify_token" not in payin.text
              assert fake_payment_api.initialize.call_count == 1

              # Same key and payload returns the same checkout without creating another one.
              payin_replay = client.post("/api/payments/create", headers=payin_headers, json=payin_payload)
              assert payin_replay.status_code == 200, payin_replay.text
              assert payin_replay.json()["idempotent_replay"] is True
              assert payin_replay.json()["public_id"] == payin_json["public_id"]
              assert fake_payment_api.initialize.call_count == 1

              # A different payload may not reuse the same idempotency key.
              payin_mismatch = client.post("/api/payments/create", headers=payin_headers, json={
                  **payin_payload,
                  "amount": "1005",
              })
              assert payin_mismatch.status_code == 409, payin_mismatch.text

              # A forged notification token must be rejected before querying the provider.
              notification_payload = {
                  "notify_token": "wrong-token",
                  "merchant_transaction_id": payin_json["merchant_transaction_id"],
                  "transaction_id": "ci-cinetpay-transaction-001",
              }
              forged = client.post("/api/cinetpay/payin/notify", json=notification_payload)
              assert forged.status_code == 401, forged.text
              assert fake_payment_api.get_status.call_count == 0

              # Only a provider-side SUCCESS can credit the wallet.
              fake_provider_status.merchant_transaction_id = payin_json["merchant_transaction_id"]
              fake_payment_api.get_status.return_value = fake_provider_status
              notification_payload["notify_token"] = "ci-notify-token"
              notification = client.post("/api/cinetpay/payin/notify", json=notification_payload)
              assert notification.status_code == 200, notification.text
              assert notification.json()["status"] == "accepted"

              # Replayed webhook must not credit twice.
              duplicate_notification = client.post("/api/cinetpay/payin/notify", json=notification_payload)
              assert duplicate_notification.status_code == 200, duplicate_notification.text
              assert duplicate_notification.json()["status"] == "accepted"
              assert fake_payment_api.get_status.call_count == 1

              # A user can inspect only their own payment records.
              alice_payments = client.get("/api/payments", headers=headers)
              bob_payments = client.get("/api/payments", headers=bob_headers)
              assert alice_payments.status_code == 200 and len(alice_payments.json()["items"]) == 1
              assert alice_payments.json()["items"][0]["status"] == "accepted"
              assert bob_payments.status_code == 200 and bob_payments.json()["items"] == []

          payin_ledger_entries = engine.connect().execute(
              main.LedgerEntry.__table__.select().where(
                  main.LedgerEntry.reference == "CNPIN-" + payin_json["public_id"]
              )
          ).fetchall()
          assert len(payin_ledger_entries) == 1

          # Verify missing/disabled PayIn configuration fails closed.
          os.environ["CINETPAY_ENABLED"] = "false"
          disabled_payin = client.post("/api/payments/create", headers={
              **headers, "Idempotency-Key": "alice-cinetpay-disabled-001"
          }, json=payin_payload)
          assert disabled_payin.status_code == 503, disabled_payin.text
          os.environ["CINETPAY_ENABLED"] = "true"

          transfers = client.get("/api/transfers", headers=headers)
          withdrawals = client.get("/api/withdrawals", headers=headers)
          assert transfers.status_code == 200 and len(transfers.json()["items"]) == 1
          assert withdrawals.status_code == 200 and len(withdrawals.json()["items"]) == 1

          print("Think Sandbox API smoke test OK: signup, auth, credit, external transfer, withdrawal, Alice-to-Bob internal transfer, mocked CinetPay PayIn, verified webhook, duplicate webhook protection, idempotency, balances, history, notifications.")
          client.close()
          engine.dispose()
          PY
